<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Configurações do Carrossel</title>
    <script>
        // Verifica a autenticação ao carregar a página
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
    <link rel="stylesheet" href="../css/admin.css"> <!-- Se necessário, adicione um CSS para estilização -->
    <link rel="shortcut icon" href="../images/Logo%20Dark%20background.png" type="image/x-icon">

    <style>
        input[type="file"]::file-selector-button {
            padding: 1%;
            background-color: #ffffff;
            color: black;
            border: 1px solid #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 2.2vw;
            font-family: "Zilla Slab", serif;
        }
    </style>
</head>
<body>
    <header>
        <img src="../images/Logo%20vertical%20dark%20background.png " alt="">
    </header>

    <div id="title">
        <h1>PAINEL ADMINISTRATIVO</h1>
    </div>

    <main>
        <div class="config">
            <!-- Upload de Imagens -->
            <section id="image-upload-section">
                <h2>ESCOLHER IMAGENS</h2>
                <div class="itens">
                    <input type="file" id="carousel2-imageUpload" multiple value="ESCOLHER ARQUIVOS" />
                    <button class="btn" onclick="uploadImage()">UPLOAD</button>
                </div>
            </section>

            <!-- Configuração de Tempo de Transição -->
            <section id="carousel-time-section">
                <h2>DEFINIR TEMPO DE TRANSIÇÃO</h2>
                <div class="itens">
                    <label for="carouselTime2"></label><input type="number" id="carouselTime2" min="1" placeholder="Tempo em segundos" />
                    <button class="btn" id="saveTimeBtn2">SALVAR</button>
                </div>
            </section>
        </div>

        <!-- Lista de Imagens Carregadas -->
        <section id="image-list-section">
            <h2>IMAGENS CARREGADAS</h2>
            <div id="carousel2-imageList"></div>
        </section>
    </main>

    <footer>
        <button onclick="logout()">Logout</button>
    </footer>

    <script src="../javascript/auth.js"></script>
    <script src="../javascript/carrosel_image.js"></script> <!-- Carrega o JavaScript com as funcionalidades do carrossel -->
</body>
</html>
